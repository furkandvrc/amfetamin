name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and pack macOS
        run: bash scripts/pack-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: amfetamin-macos
          path: dist/amfetamin-macos.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and pack Windows
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process Bypass
          ./scripts/pack-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: amfetamin-windows
          path: dist/amfetamin-windows.zip

  publish:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES="$(mktemp)"
          bash scripts/extract-release-notes.sh "$TAG" > "$NOTES"
          gh release create "$TAG" \
            --title "amfetamin ${TAG#v}" \
            --notes-file "$NOTES" \
            --latest \
            "artifacts/amfetamin-macos/amfetamin-macos.zip" \
            "artifacts/amfetamin-windows/amfetamin-windows.zip"
