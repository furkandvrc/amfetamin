name: Engine Release

on:
  push:
    tags:
      - 'engine-v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: engine
    strategy:
      matrix:
        include:
          - asset: amfetamin-engine-darwin-arm64
            os: darwin
            arch: arm64
            runner: macos-latest
          - asset: amfetamin-engine-darwin-amd64
            os: darwin
            arch: amd64
            runner: macos-15-intel
          - asset: amfetamin-engine.exe
            os: windows
            arch: amd64
            runner: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install libpcap (macOS)
        if: matrix.os == 'darwin'
        run: brew install libpcap || true

      - name: Install Npcap SDK and MinGW (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://npcap.com/dist/npcap-sdk-1.13.zip" -OutFile npcap-sdk.zip
          Expand-Archive npcap-sdk.zip -DestinationPath npcap-sdk
          choco install mingw -y
          echo "CGO_CFLAGS=-I${{ github.workspace }}/npcap-sdk/Include" >> $env:GITHUB_ENV
          echo "CGO_LDFLAGS=-L${{ github.workspace }}/npcap-sdk/Lib/x64 -lwpcap" >> $env:GITHUB_ENV

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '1'
        shell: bash
        run: |
          mkdir -p ../dist
          go build -tags with_gvisor -ldflags="-s -w" -o "../dist/${{ matrix.asset }}" ./cmd/gecit

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}*

  release:
    name: Publish engine release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Prepare release assets
        run: |
          mkdir -p release/
          find artifacts -type f | while read -r file; do
            name=$(basename "$file")
            cp "$file" "release/$name"
            chmod +x "release/$name" || true
            sha256sum "release/$name" >> release/checksums.txt
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/amfetamin-engine-darwin-arm64
            release/amfetamin-engine-darwin-amd64
            release/amfetamin-engine.exe
            release/checksums.txt
